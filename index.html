<script src="https://js.paystack.co/v2/inline.js" defer></script>
<style>
:root{
  --bg:#F1F1EE;--surface:#FFFFFF;--ink:#0F0F10;--ink-2:#26262A;--muted:#6C6C70;--line:#E2E2DD;
  --lime:#C8EF62;--lime-ink:#2E3A06;--mint:#DDF2E3;--peach:#FCE3D6;--lilac:#E7E2F7;--sky:#DCEBF7;--sand:#F3EBD9;
  --danger:#B3261E;
  --display:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-lg:28px;--r-md:20px;--r-sm:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-0.035em;text-wrap:balance;line-height:1.04}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:18px;padding-block:calc(16px + env(safe-area-inset-top,0px)) 130px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 18px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.brand small{display:block;color:var(--muted);font-size:13px;line-height:1.2}
.brand strong{display:block;font-family:var(--display);font-size:20px;letter-spacing:-0.03em;line-height:1.15}
.topnav{display:none;gap:4px;background:var(--surface);padding:5px;border-radius:999px;border:1px solid var(--line)}
.topnav a{padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.topnav a.on{background:var(--ink);color:#fff}
.signin-sm{font-size:14px;font-weight:700;padding:10px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}

.hero{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:26px;display:grid;gap:22px;overflow:hidden}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:#E9E9E4}
.dot{width:9px;height:9px;border-radius:50%;background:var(--lime);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,239,98,.55)}70%{box-shadow:0 0 0 9px rgba(200,239,98,0)}100%{box-shadow:0 0 0 0 rgba(200,239,98,0)}}
.hero h1{font-size:clamp(38px,10vw,64px);margin-top:14px}
.hero .lede{color:#BDBDB8;margin-top:14px;max-width:36ch}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border-radius:999px;font-weight:700;font-size:16px;white-space:nowrap;transition:transform .15s ease,opacity .15s}
.btn:active{transform:scale(.97)}
.btn[aria-disabled="true"],.btn:disabled{opacity:.4;pointer-events:none}
.btn-lime{background:var(--lime);color:var(--ink)}
.btn-ghost{color:#fff;border:1.5px solid #3A3A3F}
.btn-ink{background:var(--ink);color:#fff}
.btn-line{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn-block{width:100%}
.photo{border-radius:22px;background:var(--ink-2);min-height:220px;display:grid;place-items:center;position:relative;overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .mono{font-family:var(--display);font-weight:800;font-size:120px;letter-spacing:-0.06em;color:var(--lime);line-height:1}
.photo.empty{display:none}
@media (min-width:760px){.photo.empty{display:grid}}
.photo .tag{position:absolute;left:12px;bottom:12px;background:rgba(15,15,16,.78);color:#fff;font-size:12px;font-weight:600;padding:7px 11px;border-radius:999px}

.proof{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.proof div{background:var(--surface);border-radius:var(--r-sm);padding:14px 12px;border:1px solid var(--line)}
.proof b{display:block;font-family:var(--display);font-size:22px;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.proof span{font-size:12.5px;color:var(--muted);line-height:1.3;display:block;margin-top:2px}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px}
.sec-head h2{font-size:26px}

.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:14px;transition:transform .2s ease}
.card:hover{transform:translateY(-2px)}
.card .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ico{width:54px;height:54px;border-radius:16px;background:var(--surface);display:grid;place-items:center;flex:none}
.ico svg{width:24px;height:24px}
.arrow{width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.arrow svg{width:18px;height:18px}
.card h3{font-size:27px}
.card p{color:#3B3B3E;font-size:15.5px;max-width:38ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--surface)}
.chip.dark{background:var(--ink);color:#fff}
.free-tag{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.14em;color:#fff;background:#178A4A;padding:6px 11px;border-radius:999px}
.free-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lime)}
.chip.soon{background:transparent;border:1.5px dashed #9B95B5;color:#4A4466}
.t-mint{background:var(--mint)}.t-peach{background:var(--peach)}.t-lilac{background:var(--lilac)}.t-sky{background:var(--sky)}.t-sand{background:var(--sand)}

.event{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;align-items:center;gap:16px}
.date{width:70px;flex:none;border-radius:16px;background:var(--ink);color:#fff;text-align:center;padding:10px 0}
.date small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--lime)}
.date b{display:block;font-family:var(--display);font-size:28px;line-height:1.05;letter-spacing:-0.03em}
.event .meta{min-width:0;flex:1}
.event .meta small{color:var(--muted);font-size:13px;font-weight:600}
.event .meta h3{font-size:20px;margin-top:2px}
.event .meta p{color:var(--muted);font-size:14px;margin-top:2px}

.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--muted);padding:8px 0;margin-bottom:6px}
.detail-hero{border-radius:var(--r-lg);padding:26px 22px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#4D4D50}
.detail-hero h1{font-size:clamp(32px,8.5vw,52px);margin-top:10px}
.detail-hero p{margin-top:12px;font-size:17px;color:#2F2F33;max-width:42ch}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:22px;border:1px solid var(--line);margin-top:12px}
.panel h3{font-size:20px;margin-bottom:12px}
.list{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:12px;align-items:flex-start;font-size:15.5px}
.list .n{width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-size:12px;flex:none;margin-top:-2px}
.tick{width:22px;height:22px;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.note{font-size:13.5px;color:var(--muted);margin-top:10px;text-align:center}

/* Picker */
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--ink)}
.cal{border:1.5px solid var(--line);border-radius:20px;padding:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-family:var(--display);font-size:17px;letter-spacing:-0.02em}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.cal-nav button:disabled{opacity:.3}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .dow{font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 0 6px;letter-spacing:.04em}
.cd{aspect-ratio:1;max-width:100%;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;position:relative;line-height:1}
.cd.off{color:#C2C2BD}
.cd.closed{color:#A8A8A4;text-decoration:line-through}
.cd.open{background:var(--bg);color:var(--ink)}
.cd.open:hover{outline:1.5px solid var(--ink)}
.cd.open::after{content:"";width:5px;height:5px;border-radius:50%;background:#5E8A0B;position:absolute;bottom:6px}
.cd.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cd[aria-pressed="true"]{background:var(--ink);color:#fff}
.cd[aria-pressed="true"]::after{background:var(--lime)}
.cal-note{font-size:13px;color:var(--muted);margin-top:10px}
.slot-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:18px}
.slot-head b{font-size:15.5px}
.slot-head span{font-size:13px;color:var(--muted)}
.callout{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--mint);font-size:14.5px;margin-bottom:16px}
.callout svg{width:22px;height:22px;flex:none;margin-top:1px}
.callout b{display:block}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-inline:-4px;padding-inline:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:64px;padding:10px 0;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:center;line-height:1.15}
.day small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.day b{display:block;font-family:var(--display);font-size:22px;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.day i{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:2px}
.day[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.day[aria-pressed="true"] small,.day[aria-pressed="true"] i{color:#BDBDB8}
.day.full{opacity:.45}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.slot{height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;display:grid;place-items:center}
.slot:not(:disabled):hover{border-color:var(--ink)}
.slot[aria-pressed="true"]{background:var(--lime);border-color:var(--ink);font-weight:500}
.slot:disabled{background:var(--bg);color:#A8A8A4;text-decoration:line-through;border-style:dashed}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;border:1.5px solid var(--line);display:inline-block;background:var(--surface)}
.legend i.x{background:var(--bg);border-style:dashed}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:15px;background:var(--bg);border-radius:16px;margin-top:14px}
.skeleton{height:52px;border-radius:14px;background:linear-gradient(90deg,#ECECE8,#F6F6F3,#ECECE8);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.picked{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:16px;background:var(--bg);margin-bottom:16px}
.picked b{display:block;font-size:15.5px}
.picked span{font-size:13.5px;color:var(--muted)}
.picked button{font-weight:700;font-size:14px;text-decoration:underline}

.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{height:58px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.seg button small{font-weight:500;font-size:11.5px;color:var(--muted);margin-top:3px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg button[aria-pressed="true"] small{color:#BDBDB8}
.opts{display:grid;gap:8px}
.board-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.streak{text-align:right;line-height:1.1}.streak b{display:block;font-family:var(--display);font-size:30px;letter-spacing:-0.03em}.streak span{font-size:12px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tile{aspect-ratio:1;min-width:0;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.tile small{position:absolute;top:6px;left:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.tile span{font-weight:800;font-size:15px;letter-spacing:-0.06em}
.tile.t-done{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.tile.t-done small{color:var(--lime-ink)}
.tile.t-up{background:var(--surface);border-color:var(--ink)}
.tile.t-today{border:2px dashed var(--ink);background:var(--surface)}
.tile.t-today span{font-size:22px;font-weight:600}
.board-key{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:12px}
.board-key span{display:inline-flex;align-items:center;gap:6px}
.k{width:12px;height:12px;border-radius:4px;display:inline-block;border:1.5px solid var(--line)}
.k.k-up{border-color:var(--ink);background:var(--surface)}.k.k-done{background:var(--lime);border-color:var(--lime)}.k.k-today{border:1.5px dashed var(--ink)}
.board-note{font-size:14.5px;color:#3B3B3E;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
.opt .r{width:20px;height:20px;border-radius:50%;border:2px solid #BEBEB8;flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--ink)}
.opt[aria-pressed="true"] .r{border-color:var(--ink)}
.opt[aria-pressed="true"] .r::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.opt b{display:block;font-size:15.5px}
.opt span span{display:block;font-size:13.5px;color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:16px;margin-top:16px;border-top:1px solid var(--line)}
.total b{font-family:var(--display);font-size:30px;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.bonus{margin-top:12px;background:var(--lime);color:var(--lime-ink);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600}

.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:14px;font-weight:600}
.field label em{font-style:normal;font-weight:500;color:var(--muted)}
.field input,.field textarea{border-radius:14px;border:1.5px solid var(--line);padding:14px;font:inherit;font-size:16px;background:var(--bg);width:100%;color:var(--ink)}
.field input{height:52px;padding-block:0}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink);background:var(--surface)}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--bg);font-size:14.5px;margin-bottom:16px;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ink);flex:none}
.check span em{display:block;font-style:normal;color:var(--muted);font-size:13px}
.err{color:var(--danger);font-size:14px;font-weight:600;margin:-4px 0 12px}

.done{text-align:center;padding:34px 22px}
.done .big{width:76px;height:76px;border-radius:50%;background:var(--lime);display:grid;place-items:center;margin:0 auto 18px}
.done .big svg{width:36px;height:36px}
.done h1{font-size:clamp(30px,8vw,44px)}
.done p{color:#3B3B3E;margin:12px auto 0;max-width:40ch}

.about-photo{border-radius:var(--r-lg);background:var(--ink);min-height:300px;display:grid;place-items:center;position:relative;overflow:hidden}
.about-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prose{font-size:17px;line-height:1.65;display:grid;gap:14px;max-width:62ch}
.prose p{color:#2A2A2E}

.dock{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));z-index:20;pointer-events:none}
.dock nav{pointer-events:auto;max-width:460px;margin:0 auto;background:var(--ink);border-radius:999px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;box-shadow:0 14px 34px rgba(15,15,16,.28)}
.dock a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:60px;border-radius:999px;color:#A3A3A0;font-size:12px;font-weight:600}
.dock a svg{width:22px;height:22px}
.dock a.on{background:var(--lime);color:var(--ink)}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.view{animation:in .28s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hero.solo h1{max-width:14ch}
@media (min-width:760px){
  .hero.solo{grid-template-columns:1fr}
  .wrap{padding-block:26px 60px}
  .topnav{display:flex}
  .signin-sm{display:none}
  .dock{display:none}
  .hero{grid-template-columns:1.25fr .9fr;padding:40px;align-items:stretch}

async function loadSlots(silent){
  if(!silent){ B.data = null; renderBooker(); }
  const r = await api("GET", null, `?service=${B.service}&days=14`);
  if(!r.ok){ B.data = { error:true }; renderBooker(); return; }

  if(!B.date || !hasOpen(days.find(d=>d.date===B.date))){ const first = days.find(hasOpen); B.date = first ? first.date : null; }

  if(B.slot){
    const still = days.flatMap(d=>d.slots).find(s=>s.start===B.slot.start);
    if(!still || !still.open){ if(B.step==="time") toast("That time was just taken. Pick another one."); B.slot = null; }
  }
  if(B.step==="time") renderBooker();
}

function shiftMonth(ym, n){ const [y,m]=ym.split("-").map(Number); const d=new Date(Date.UTC(y,m-1+n,1)); return d.toISOString().slice(0,7); }
function calendarHTML(){
  const today = lagosDateStr(), win = B.data.window_days ?? 3, last = addDaysStr(today, win);
  const byDate = Object.fromEntries((B.data.days||[]).map(d=>[d.date,d]));
  const [y,m] = B.month.split("-").map(Number);
  const lead = (new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7, dim = new Date(Date.UTC(y,m,0)).getUTCDate();
  let cells = ["Mo","Tu","We","Th","Fr","Sa","Su"].map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<lead;i++) cells += "<div></div>";
  for(let d=1; d<=dim; d++){
    const ds = `${B.month}-${String(d).padStart(2,"0")}`, info = byDate[ds], open = info ? info.slots.filter(s=>s.open).length : 0;
    const inWin = ds >= today && ds <= last;
    const cls = !inWin ? "off" : open ? "open" : "closed";
    const t = ds===today ? " today" : "";
    if(cls==="open") cells += `<button type="button" class="cd open${t}" data-d="${ds}" aria-pressed="${ds===B.date}" aria-label="${dayParts(ds).long}, ${open} open">${d}</button>`;
    else cells += `<div class="cd ${cls}${t}" aria-hidden="true">${d}</div>`;
  }
  const canPrev = B.month > today.slice(0,7), canNext = B.month < last.slice(0,7);
  return `<div class="cal">
    <div class="cal-head"><b>${monthLabel(B.month)}</b><div class="cal-nav">

    <div class="cal-grid">${cells}</div>
  </div>
  <p class="cal-note">Book up to ${win} days ahead.</p>`;
}

    body = `<div class="cal"><div class="skeleton" style="height:260px"></div></div>`;
  } else if(B.data.error){
    body = `<div class="empty">Couldn't load times. Check your connection.<br><button class="btn btn-line" style="margin-top:12px" id="retry">Try again</button></div>`;
  } else {
    const d = (B.data.days||[]).find(x=>x.date===B.date);
    const slotsHTML = !B.date ? `<div class="empty">Everything in the next ${B.data.window_days ?? 3} days is booked. New times open every day, so check back tomorrow.</div>`
      : `<div class="slot-head"><b>${dayParts(B.date).long}</b><span>Lagos time</span></div>
         <div class="slots" role="group" aria-label="Choose a time">${d.slots.map(s=>`<button type="button" class="slot" data-s="${s.start}" ${s.open?"":"disabled aria-label=\""+s.label+" taken\""} aria-pressed="${B.slot&&B.slot.start===s.start}">${s.label}</button>`).join("")}</div>
         <div class="legend"><span><i></i>Open</span><span><i class="x"></i>Taken</span></div>`;
    body = calendarHTML() + slotsHTML;
  }
  const back = B.service==="mentorship" ? `<button type="button" class="back" id="toPlan">${I.back} Change plan</button>` : "";
  el.innerHTML = `${stepsBar()}${back}<h3>${isFree ? "Pick a day and time" : "Pick your first session"}</h3>${body}
    <div style="height:16px"></div>
    <button class="btn btn-ink btn-block" id="toDetails" ${B.slot?"":"disabled"}>${B.slot ? "Continue with " + B.slot.label : "Choose a time"}</button>
    ${isFree ? "" : `<p class="note">We'll set the rest of your sessions together on the first call.</p>`}`;
  el.querySelectorAll(".cd.open").forEach(b=>b.onclick=()=>{ B.date=b.dataset.d; renderBooker(); });
  el.querySelectorAll(".slot").forEach(b=>b.onclick=()=>{ const d=B.data.days.find(x=>x.date===B.date); B.slot = { ...d.slots.find(s=>s.start===b.dataset.s), date:d.date }; renderBooker(); });
  const mp=$("#mPrev"), mn=$("#mNext");
  if(mp) mp.onclick=()=>{ B.month=shiftMonth(B.month,-1); renderBooker(); };
  if(mn) mn.onclick=()=>{ B.month=shiftMonth(B.month,1); renderBooker(); };
  $("#toDetails").onclick = ()=>{ if(B.slot){ B.step="details"; renderBooker(); el.scrollIntoView({ behavior:"smooth", block:"start" }); } };
  const rt=$("#retry"); if(rt) rt.onclick=()=>loadSlots();
  const tp=$("#toPlan"); if(tp) tp.onclick=()=>{ B.step="plan"; renderBooker(); };
}
function lagosDateStr(){ const n=lagosNow(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`; }

function renderPlan(el){
  const list = RHYTHMS[B.hours]; if(!list.find(x=>x[0]===B.rhythm)) B.rhythm = list[0][0];
  const total = B.hours*CONFIG.hourRate;
  el.innerHTML = `${stepsBar()}<h3>Build your plan</h3>
    <div class="seg" role="group" aria-label="Hours">${[1,2,4,8].map(h=>`<button type="button" data-h="${h}" aria-pressed="${h===B.hours}">${h}<small>${h===1?"hour":"hours"}</small></button>`).join("")}</div>
    <div style="height:14px"></div>
    <div class="opts" role="group" aria-label="How to spread the hours">${list.map(([id,t,d])=>`<button type="button" class="opt" data-r="${id}" aria-pressed="${id===B.rhythm}"><span class="r"></span><span><b>${t}</b><span>${d}</span></span></button>`).join("")}</div>
    <div class="total"><span style="color:var(--muted);font-weight:600">Total</span><b>${naira(total)}</b></div>
    <div style="height:16px"></div>
    <button class="btn btn-ink btn-block" id="toTime">Pick a time</button>`;
  el.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ B.hours=+b.dataset.h; renderBooker(); });
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ B.rhythm=b.dataset.r; renderBooker(); });
  $("#toTime").onclick=()=>{ B.step="time"; renderBooker(); loadSlots(); };
}

function renderDetails(el){
  const isFree = B.service==="free_call", p = dayParts(B.slot.date), saved = B.form || {};
  el.innerHTML = `${stepsBar()}
    <div class="picked"><div><b>${p.long}, ${B.slot.label}</b><span>${isFree?"Free clarity call · 10 minutes · Video":`Mentorship · ${B.hours}h · ${naira(B.hours*CONFIG.hourRate)}`}</span></div><button type="button" id="chg">Change</button></div>
    ${isFree?`<div class="callout">${I.video}<span><b>Video call on Google Meet.</b>This is your only free call, so set a reminder.</span></div>`:""}
    <form id="bform" novalidate>
      <div class="field"><label for="f-name">Your name</label><input id="f-name" name="name" autocomplete="name" value="${esc(saved.name)}" required></div>
      <div class="field"><label for="f-email">Email <em>(your confirmation goes here)</em></label><input id="f-email" name="email" type="email" inputmode="email" autocomplete="email" value="${esc(saved.email)}" required></div>
      <div class="field"><label for="f-phone">Phone number ${isFree?"<em>(WhatsApp if you have it)</em>":"<em>(optional)</em>"}</label><input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(saved.phone)}" ${isFree?"required":""}></div>
      <div class="field"><label for="f-note">${isFree?"What are you stuck on?":"What do you want to work on?"}</label><textarea id="f-note" name="note" maxlength="600" placeholder="${isFree?"One or two lines is enough.":"Give me a head start."}">${esc(saved.note)}</textarea></div>
      <label class="check"><input type="checkbox" id="f-opt" name="opt" ${saved.opt?"checked":""}><span>Send me Genie's emails<em>Short notes on mindset, communication and getting things done. Leave anytime.</em></span></label>
      <div class="err" id="ferr" hidden></div>
      <button class="btn btn-ink btn-block" type="submit" id="fsub">${isFree?"Confirm my call":"Pay "+naira(B.hours*CONFIG.hourRate)}</button>
      ${isFree?"":`<p class="note">Secured by Paystack. Your time is held for 15 minutes while you pay.</p>`}
    </form>`;
  $("#chg").onclick=()=>{ B.form = readForm(); B.step="time"; renderBooker(); loadSlots(true); };
  $("#bform").addEventListener("submit", e=>{ e.preventDefault(); submitBooking(); });
  if(isFree){
    const check = async ()=>{
      const f = readForm();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email)) return;
      const r = await api("POST",{ action:"check", email:f.email, phone:f.phone });
      if(r.ok && r.eligible===false){ showErr(ERR.free_call_used); $("#fsub").disabled = true; }
      else if(r.ok){ $("#ferr").hidden = true; $("#fsub").disabled = false; }
    };
    $("#f-email").addEventListener("blur", check);
    $("#f-phone").addEventListener("blur", check);
  }
}
function readForm(){ const f=$("#bform"); if(!f) return {}; const v=n=>f.querySelector(`[name=${n}]`); return { name:v("name").value.trim(), email:v("email").value.trim(), phone:v("phone").value.trim(), note:v("note").value.trim(), opt:v("opt").checked }; }
function showErr(m){ const e=$("#ferr"); e.textContent=m; e.hidden=false; }
function setBusy(on, label){ const b=$("#fsub"); if(!b) return; b.disabled=on; b.innerHTML = on ? `<span class="spin"></span> ${label||""}` : label; }

async function submitBooking(){
  if(B.busy) return;
  const f = readForm(); B.form = f;
  if(!f.name) return showErr(ERR.missing_name);
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email)) return showErr(ERR.bad_email);
  if(B.service==="free_call" && f.phone.replace(/\D/g,"").length < 7) return showErr(ERR.missing_phone);
  if(B.service==="free_call" && !f.note) return showErr("Tell me in a line what you're stuck on, so we don't waste your ten minutes.");
  $("#ferr").hidden = true; B.busy = true;
  const base = { service:B.service, start:B.slot.start, name:f.name, email:f.email, phone:f.phone, note:f.note, opt_in:f.opt };

  if(B.service==="free_call"){
    setBusy(true, "Booking");
    const r = await api("POST", { action:"book", ...base });
    B.busy = false;
    if(r.ok) return showDone({ title:"You're booked.", line:`${r.booking.date} at ${r.booking.label}`, text:`This is your only free call. Add it to your calendar so your phone reminds you.`, cal:{ start:r.booking.start || B.slot.start, mins:10, title:"Clarity call with Genie" } });
    setBusy(false, "Confirm my call"); showErr(errMsg(r.error));
    if(["slot_taken","too_soon","not_a_slot","too_far"].includes(r.error)){ B.slot=null; setTimeout(()=>{ B.step="time"; renderBooker(); loadSlots(); }, 1600); }
    return;
  }

  setBusy(true, "Holding your time");
  const h = await api("POST", { action:"hold", hours:B.hours, plan:planText(), ...base });
  if(!h.ok){ B.busy=false; setBusy(false, "Pay "+naira(B.hours*CONFIG.hourRate)); showErr(errMsg(h.error));
    if(["slot_taken","too_soon","not_a_slot","too_far"].includes(h.error)){ B.slot=null; setTimeout(()=>{ B.step="time"; renderBooker(); loadSlots(); }, 1600); }
    return; }
  if(typeof PaystackPop==="undefined"){ B.busy=false; setBusy(false,"Pay "+naira(B.hours*CONFIG.hourRate)); return showErr("Payment couldn't load. Refresh the page and try again."); }
  setBusy(true, "Opening payment");
  const handler = PaystackPop.setup({
    key: CONFIG.paystackKey, email: h.email, amount: h.amount_kobo, currency:"NGN", ref: h.reference,
    metadata:{ custom_fields:[{ display_name:"Service", variable_name:"service", value:"Mentorship" },{ display_name:"Plan", variable_name:"plan", value:`${B.hours}h, ${planText()}` }] },
    onClose: ()=>{ B.busy=false; setBusy(false, "Pay "+naira(B.hours*CONFIG.hourRate)); showErr("Payment closed before it finished. You haven't been charged. Tap pay to try again."); api("POST",{ action:"release", reference:h.reference }); },
    callback: async (res)=>{
      setBusy(true, "Confirming payment");
      const c = await api("POST", { action:"confirm", reference: res.reference || h.reference });
      B.busy = false;
      if(c.ok){
        const wa = c.whatsapp ? `<div class="panel" style="text-align:left"><h3>You can reach me directly</h3><dl class="kv"><dt>WhatsApp</dt><dd>${esc(c.whatsapp)}</dd></dl></div>` : "";
        return showDone({ title:"You're in.", line: c.booking ? `First session: ${c.booking.date} at ${c.booking.label}` : "Payment confirmed", text:`Your confirmation and call link are on the way to ${esc(f.email)}. We'll set the rest of your sessions on our first call.`, extra: wa });
      }
      setBusy(false, "Pay "+naira(B.hours*CONFIG.hourRate)); showErr(errMsg(c.error) + " Reference: " + (res.reference||h.reference));
    }
  });
  handler.openIframe();
}
function calLinks(c){
  const st=new Date(c.start), en=new Date(st.getTime()+c.mins*60000);
  const f=d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const details=`Join here: ${CONFIG.meet}\nIt's a video call. Come with your camera on.`;
  const g=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(c.title)}&dates=${f(st)}/${f(en)}&details=${encodeURIComponent(details)}&location=${encodeURIComponent(CONFIG.meet)}`;
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//with Genie//EN","BEGIN:VEVENT",`UID:${f(st)}-genie@eugeneobo.com`,`DTSTAMP:${f(new Date())}`,`DTSTART:${f(st)}`,`DTEND:${f(en)}`,`SUMMARY:${c.title}`,`DESCRIPTION:${details.replace(/\n/g,"\\n")}`,`LOCATION:${CONFIG.meet}`,"BEGIN:VALARM","TRIGGER:-PT30M","ACTION:DISPLAY","DESCRIPTION:Call with Genie in 30 minutes","END:VALARM","BEGIN:VALARM","TRIGGER:-PT10M","ACTION:DISPLAY","DESCRIPTION:Call with Genie in 10 minutes","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const icsUrl=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  return `<div style="display:grid;gap:10px;max-width:340px;margin:22px auto 0">
    <a class="btn btn-ink btn-block" href="${g}" target="_blank" rel="noopener">Add to Google Calendar</a>
    <a class="btn btn-line btn-block" href="${icsUrl}" download="call-with-genie.ics">iPhone or other calendar</a>
  </div>`;
}
function showDone({ title, line, text, extra, cal }){
  clearInterval(B.poll); B.step="done";
  $("#app").innerHTML = `<div class="view"><div class="panel done">
    <div class="big">${I.check}</div>
    <span class="eyebrow">Confirmed</span>
    <h1 style="margin-top:8px">${title}</h1>
    <p style="font-weight:700;color:var(--ink)">${esc(line)}</p>
    <p>${text}</p>
    ${cal ? calLinks(cal) : ""}
    <div class="ctas" style="justify-content:center"><a class="btn ${cal?"btn-ghost":"btn-line"}" style="${cal?"color:var(--muted);border-color:var(--line)":""}" href="#services">See other services</a></div>
  </div>${extra||""}</div>`;
  window.scrollTo(0,0);
}

/* ---------- Cancel link from email ---------- */
async function handleCancel(token){
  $("#app").innerHTML = `<div class="view"><div class="panel done"><span class="eyebrow">Your booking</span><h1 style="margin-top:8px">Cancel your call?</h1><p>This frees your slot for someone else.</p>
    <div class="ctas" style="justify-content:center"><button class="btn btn-ink" id="yes">Yes, cancel it</button><a class="btn btn-line" href="/book">Keep it</a></div><div class="err" id="cerr" hidden style="margin-top:14px"></div></div></div>`;
  $("#yes").onclick = async ()=>{
    $("#yes").disabled = true; $("#yes").innerHTML = '<span class="spin"></span>';
    const r = await api("POST", { action:"cancel", token });
    if(r.ok){ $("#app").innerHTML = `<div class="view"><div class="panel done"><div class="big">${I.check}</div><h1>Cancelled.</h1><p>${r.when?esc(r.when)+" is free again. ":""}Want a different time?</p><div class="ctas" style="justify-content:center"><a class="btn btn-ink" href="/book#call">Book another time</a></div></div></div>`; }
    else { const m = { paid_contact_genie:"Paid sessions can't be cancelled here. Reply to your confirmation email and I'll sort it out.", already_past:"This call has already happened.", not_found:"I couldn't find that booking." }[r.error] || ERR.default; const e=$("#cerr"); e.textContent=m; e.hidden=false; $("#yes").remove(); }
  };
}

/* ---------- Router ---------- */
function route(){
  let key = (location.hash || "#home").slice(1);
  const scrollToServices = key === "services";
  if(scrollToServices) key = "home";
  if(!views[key]) key = "home";
  clearInterval(B.poll);
  $("#app").innerHTML = `<div class="view">${views[key]()}</div>`;
  document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("on", a.dataset.nav === (scrollToServices ? "services" : key)));
  if(key==="call") startBooker("free_call");
  if(key==="mentorship") startBooker("mentorship");
  wireWaitForms();
  if(scrollToServices) setTimeout(()=>document.getElementById("services")?.scrollIntoView({ behavior:"smooth" }), 30);
  else window.scrollTo(0,0);
}
const cancelToken = new URLSearchParams(location.search).get("cancel");
if(cancelToken) handleCancel(cancelToken);
else { window.addEventListener("hashchange", route); route(); }
</script>
</body>
</html>
