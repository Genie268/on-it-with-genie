<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#060606">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest-capture.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Capture</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#060606;color:#ededed;font-family:Helvetica,Arial,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#777;margin-bottom:12px}
.top b{color:#c49a1c;font-weight:800}
#sync{letter-spacing:.04em;text-transform:none}
#sync.wait{color:#c49a1c}
textarea{flex:1;min-height:180px;width:100%;resize:none;background:#111;color:#f4f4f4;border:1px solid #222;border-radius:16px;padding:18px;font-size:20px;line-height:1.45;outline:none;font-family:inherit}
textarea:focus{border-color:#c49a1c}
textarea::placeholder{color:#555}
.row{display:flex;gap:10px;margin-top:12px}
button{font-family:inherit;border:0;border-radius:14px;font-size:17px;font-weight:800;padding:18px;cursor:pointer}
#save{flex:1;background:#c49a1c;color:#060606}
#save:disabled{opacity:.35}
#clear{background:#1a1a1a;color:#999;padding:18px 20px}
#install{display:none;width:100%;margin-top:10px;background:#1a1a1a;color:#ededed;font-size:15px}
#list{margin-top:14px;max-height:32vh;overflow:auto}
.item{display:flex;gap:10px;padding:10px 2px;border-top:1px solid #161616;font-size:14px;color:#aaa;line-height:1.4}
.item i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:#c49a1c}
.item.wait i{background:#444}
.item span{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item em{flex:none;font-style:normal;color:#555;font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(20px);background:#ededed;color:#060606;font-weight:800;padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#lock{display:none;flex:1;flex-direction:column;justify-content:center;gap:14px;max-width:360px;width:100%;margin:0 auto}
#lock h1{font-size:28px;font-weight:900;letter-spacing:-.02em}
#lock p{color:#888;font-size:15px}
#lock input{background:#111;border:1px solid #222;border-radius:14px;color:#fff;font-size:22px;padding:16px;letter-spacing:.3em;text-align:center;outline:none}
#lock input:focus{border-color:#c49a1c}
#lock button{background:#c49a1c;color:#060606}
#lockErr{color:#e66;font-size:14px;min-height:18px}
body.locked #app{display:none}
body.locked #lock{display:flex}
#app{flex:1;display:flex;flex-direction:column}
.tabs{display:flex;gap:6px}
.tabs button{background:none;color:#666;padding:6px 10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;border-radius:99px}
.tabs button.on{background:#1a1a1a;color:#c49a1c}
#planView{display:none;flex:1;overflow:auto;padding-bottom:20px}
body.plan #capView{display:none}
body.plan #planView{display:block}
#capView{flex:1;display:flex;flex-direction:column}
.day{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#777;margin:18px 2px 8px}
.card{background:#111;border:1px solid #1d1d1d;border-radius:14px;padding:14px;margin-bottom:8px}
.card .when{font-size:12px;color:#c49a1c;font-weight:700;margin-bottom:4px}
.card .when span{color:#666;font-weight:400}
.card h3{font-size:17px;font-weight:800;line-height:1.3}
.card .next{font-size:14px;color:#bbb;margin-top:6px;line-height:1.4}
.card .meta{font-size:12px;color:#666;margin-top:6px}
.card details{margin-top:8px}
.card summary{font-size:13px;color:#888;cursor:pointer}
.card ol{margin:8px 0 0 18px;font-size:14px;color:#ccc;line-height:1.45}
.card ol li{margin-bottom:4px}
.card .raw{font-size:13px;color:#777;margin-top:8px;font-style:italic}
.acts{display:flex;gap:6px;margin-top:12px}
.acts button{flex:1;padding:11px 6px;font-size:14px;border-radius:10px;background:#1a1a1a;color:#ddd}
.acts button.done{background:#c49a1c;color:#060606}
.slip{color:#e66}
#notif{display:none;width:100%;margin:6px 0 4px;background:#1a1a1a;color:#c49a1c;font-size:15px}
.empty{color:#666;font-size:15px;text-align:center;margin-top:40px;line-height:1.5}

</style>
</head>
<body>
<div id="lock">
  <h1>Capture</h1>
  <p>Enter your admin PIN once. This device stays unlocked after that.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off">
  <button id="unlock">Unlock</button>
  <div id="lockErr"></div>
</div>

<div id="app">
  <div class="top"><div class="tabs"><button id="tCap" class="on">Capture</button><button id="tPlan">Plan</button></div><span id="sync"></span></div>
  <div id="capView">
  <textarea id="box" placeholder="Talk or type. Save. Move on." autofocus></textarea>
  <div class="row">
    <button id="clear" aria-label="Clear">Clear</button>
    <button id="save" disabled>Save</button>
  </div>
  <button id="install">Add Capture to home screen</button>
  <div id="list"></div>
  </div>
  <div id="planView">
    <button id="notif">Turn on reminders</button>
    <div id="planBody"><div class="empty">Loading…</div></div>
  </div>
</div>
<div id="toast">Saved</div>

<script>
const API = "https://vbafqulhbskaswkyjjdn.supabase.co/functions/v1/capture-api";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZiYWZxdWxoYnNrYXN3a3lqamRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYwODE3NDcsImV4cCI6MjA4MTY1Nzc0N30.cg7zCIJN9cPd1XUO29BVDjxDlOxcTzY1p6ndDThWr4Q";
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
// queue = not yet on the server; recent = what you see in the list
let queue = store.get("cap_queue", []);
let recent = store.get("cap_recent", []);
let key = store.get("cap_key", "");

async function call(payload){
  const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", apikey:ANON, Authorization:"Bearer "+ANON }, body: JSON.stringify(payload) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && payload.action !== "unlock") { lock(); throw new Error("locked"); }
  if (!r.ok || !j.ok) throw new Error(j.error || "failed");
  return j;
}

function lock(){ key = ""; store.set("cap_key", ""); document.body.classList.add("locked"); }
function ago(iso){
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "now"; if (s < 3600) return Math.floor(s/60)+"m";
  if (s < 86400) return Math.floor(s/3600)+"h"; return Math.floor(s/86400)+"d";
}
function render(){
  const waiting = new Set(queue.map(q => q.client_id));
  $("list").innerHTML = recent.slice(0, 15).map(r =>
    `<div class="item${waiting.has(r.client_id) ? " wait" : ""}"><i></i><span></span><em>${ago(r.captured_at)}</em></div>`).join("");
  [...$("list").querySelectorAll("span")].forEach((el, i) => el.textContent = recent[i].body);
  const s = $("sync");
  if (queue.length) { s.textContent = queue.length + " waiting for network"; s.className = "wait"; }
  else { s.textContent = recent.length ? "All saved" : ""; s.className = ""; }
}

let flushing = false;
async function flush(){
  if (flushing || !queue.length || !key || !navigator.onLine) { render(); return; }
  flushing = true;
  try {
    const batch = queue.slice(0, 50);
    const j = await call({ action:"save", key, items: batch });
    const done = new Set(j.saved);
    queue = queue.filter(q => !done.has(q.client_id));
    store.set("cap_queue", queue);
    if (done.size) setTimeout(nudgeOrganizer, 500);
  } catch(e) {}
  flushing = false;
  render();
  if (queue.length && navigator.onLine) setTimeout(flush, 15000);
}

function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 1100); }

function save(){
  const body = $("box").value.trim();
  if (!body) return;
  const item = { client_id: (crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random().toString(36).slice(2)), body, captured_at: new Date().toISOString() };
  queue.push(item); store.set("cap_queue", queue);
  recent.unshift(item); recent = recent.slice(0, 40); store.set("cap_recent", recent);
  $("box").value = ""; store.set("cap_draft", ""); $("save").disabled = true;
  toast(navigator.onLine ? "Saved" : "Saved on this device");
  render(); flush();
  $("box").focus();
}

// keep the draft if the app is closed mid-thought
$("box").value = store.get("cap_draft", "");
$("save").disabled = !$("box").value.trim();
$("box").addEventListener("input", () => { store.set("cap_draft", $("box").value); $("save").disabled = !$("box").value.trim(); });
$("box").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); } });
$("save").addEventListener("click", save);
$("clear").addEventListener("click", () => { $("box").value = ""; store.set("cap_draft", ""); $("save").disabled = true; $("box").focus(); });

$("unlock").addEventListener("click", async () => {
  $("lockErr").textContent = "";
  try {
    const j = await call({ action:"unlock", pin: $("pin").value });
    key = j.key; store.set("cap_key", key);
    document.body.classList.remove("locked");
    $("box").focus(); flush();
  } catch(e) { $("lockErr").textContent = navigator.onLine ? "Wrong PIN" : "You need network to unlock the first time"; }
});
$("pin").addEventListener("keydown", e => { if (e.key === "Enter") $("unlock").click(); });

window.addEventListener("online", flush);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { flush(); if (document.body.classList.contains("plan")) loadPlan(); else $("box").focus(); } });

// one-tap install where Chrome allows it
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("install").style.display = "block"; });
$("install").addEventListener("click", async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("install").style.display = "none"; });
window.addEventListener("appinstalled", () => { $("install").style.display = "none"; });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});


// ---------- Plan ----------
const ORG = "https://vbafqulhbskaswkyjjdn.supabase.co/functions/v1/capture-organize";
const VAPID = "BIsYpRrSeUjZSz9RK_6Y3ueIvrEI4C_jl2A91UL_GR93H4-bLHQUxJIm-ZduQJEK9XORRRyYe4Hyf2HesuOC_fI";
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const lagos = d => new Date(new Date(d).getTime() + 3600000);
function dayName(iso){
  const d = lagos(iso).toISOString().slice(0,10), t = lagos(Date.now()).toISOString().slice(0,10);
  const tm = lagos(Date.now() + 86400000).toISOString().slice(0,10);
  if (d === t) return "Today"; if (d === tm) return "Tomorrow";
  return lagos(iso).toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"short", timeZone:"UTC" });
}
function clock(iso){ const d = lagos(iso); let h = d.getUTCHours(), m = d.getUTCMinutes(); const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return h + (m ? ":" + String(m).padStart(2,"0") : "") + ap; }
function card(c, idea){
  const pending = c.status === "new" || (c.scheduled_for && new Date(c.scheduled_for).getTime() < 86400000);
  const when = idea ? `<div class="when">Parked idea <span>· ${esc(c.kind || "")}</span></div>`
    : pending ? `<div class="when">Finding a slot…</div>`
    : `<div class="when">${clock(c.scheduled_for)} <span>· ${esc(c.block_label || "")}</span></div>`;
  const dirs = Array.isArray(c.directions) && c.directions.length ? `<details><summary>Directions</summary><ol>${c.directions.map(d => `<li>${esc(d)}</li>`).join("")}</ol><div class="raw">“${esc(c.body)}”</div></details>` : `<div class="raw">“${esc(c.body)}”</div>`;
  const meta = [c.minutes ? c.minutes + " min" : "", c.energy ? c.energy + " energy" : "", c.nudges ? `<span class="slip">moved ${c.nudges}×</span>` : ""].filter(Boolean).join(" · ");
  const acts = idea
    ? `<button data-a="schedule" data-id="${c.id}">Give it a time</button><button data-a="drop" data-id="${c.id}">Drop</button>`
    : `<button class="done" data-a="done" data-id="${c.id}">Done</button><button data-a="later" data-id="${c.id}">Later</button><button data-a="park" data-id="${c.id}">Park</button><button data-a="drop" data-id="${c.id}">Drop</button>`;
  return `<div class="card">${when}<h3>${esc(c.title || c.body.slice(0,60))}</h3>${c.next_step ? `<div class="next">${esc(c.next_step)}</div>` : ""}${meta ? `<div class="meta">${meta}</div>` : ""}${dirs}<div class="acts">${acts}</div></div>`;
}
async function loadPlan(){
  if (!key) return;
  let j;
  try { j = await call({ action:"plan", key }); store.set("cap_plan", j); }
  catch(e) { j = store.get("cap_plan", null); if (!j) { $("planBody").innerHTML = `<div class="empty">Can't load the plan without network.</div>`; return; } }
  let html = "", last = "";
  for (const c of j.open) {
    const pending = c.status === "new" || !c.scheduled_for || new Date(c.scheduled_for).getTime() < 86400000;
    const day = pending ? "Being sorted" : dayName(c.scheduled_for);
    if (day !== last) { html += `<div class="day">${day}</div>`; last = day; }
    html += card(c, false);
  }
  if (j.ideas.length) { html += `<div class="day">Parked ideas</div>` + j.ideas.map(c => card(c, true)).join(""); }
  $("planBody").innerHTML = html || `<div class="empty">Nothing open. Capture something and it shows up here within 10 minutes.</div>`;
}
$("planBody").addEventListener("click", async e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  b.disabled = true;
  try { await call({ action:"update", key, id: b.dataset.id, to: b.dataset.a }); toast({ done:"Done", later:"Moved to the next slot", park:"Parked", drop:"Dropped", schedule:"Finding it a time" }[b.dataset.a]); }
  catch(err) { toast("Needs network"); }
  loadPlan();
});
function showTab(t){
  document.body.classList.toggle("plan", t === "plan");
  $("tCap").classList.toggle("on", t !== "plan"); $("tPlan").classList.toggle("on", t === "plan");
  if (t === "plan") { loadPlan(); notifButton(); } else $("box").focus();
}
$("tCap").addEventListener("click", () => showTab("cap"));
$("tPlan").addEventListener("click", () => showTab("plan"));

// reminders (web push to this app)
function notifButton(){
  const ok = "Notification" in window && "PushManager" in window;
  $("notif").style.display = ok && Notification.permission !== "granted" ? "block" : "none";
  if (ok && Notification.permission === "granted") subscribe();
}
function b64(s){ const p = "=".repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); }
async function subscribe(){
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64(VAPID) });
    const sig = sub.endpoint;
    if (store.get("cap_sub", "") === sig) return;
    await call({ action:"subscribe", key, sub: sub.toJSON() });
    store.set("cap_sub", sig);
  } catch(e) {}
}
$("notif").addEventListener("click", async () => {
  const p = await Notification.requestPermission();
  if (p === "granted") { await subscribe(); toast("Reminders on"); }
  notifButton();
});
// ask the organizer to run now so new captures get sorted without waiting
function nudgeOrganizer(){ if (key && navigator.onLine) fetch(ORG, { method:"POST", headers:{ "Content-Type":"application/json", apikey:ANON, Authorization:"Bearer "+ANON }, body: JSON.stringify({ key }) }).catch(() => {}); }
if (new URLSearchParams(location.search).get("tab") === "plan") showTab("plan");
if (key && "Notification" in window && Notification.permission === "granted") subscribe();

if (!key) lock(); else flush();
render();
</script>
</body>
</html>
