<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EEE4">
<title>Your Goal Card</title>
<meta name="description" content="Write your goal down, one card at a time.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314204A'/%3E%3Cpath d='M18 34l9 9 19-21' stroke='%23E2513F' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/card-assets/art.js"></script>
<style>
:root{
  --paper:#F3EEE4; --card:#FFFDF8; --ink:#14204A; --soft:#6B6357; --line:#E3DBCC; --sand:#EDE4D3;
  --red:#D2402F; --red-soft:#F7DCD5; --green:#1F7A4D;
  --shadow:0 1px 0 rgba(23,20,15,.04), 0 22px 44px -22px rgba(23,20,15,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100dvh;
  background-image:radial-gradient(rgba(23,20,15,.04) 1px,transparent 1px);background-size:18px 18px}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column}
h1,h2{font-family:Archivo,system-ui,sans-serif;font-stretch:88%;letter-spacing:-.01em;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 14px;min-height:46px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.brand img{height:34px;width:34px;border-radius:50%;display:block;box-shadow:0 2px 6px rgba(20,32,74,.25)}
.dots{display:flex;gap:5px}
.dot{width:12px;height:6px;border-radius:6px;background:var(--line);transition:background .3s,width .3s}
.dot.open{background:var(--ink)}
.dot.here{background:var(--red);width:22px}
main{flex:1;display:flex;flex-direction:column}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}
.art{background:linear-gradient(180deg,#F8F3EA, var(--card));padding:18px 24px 0;display:flex;justify-content:center}
.art svg{width:min(240px,62%);height:auto;display:block;animation:float .7s .1s cubic-bezier(.2,.8,.2,1) both}
@keyframes float{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.body{padding:16px 22px 22px}
.num{font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.12em;color:var(--red);display:flex;justify-content:space-between;align-items:center;gap:8px}
.num .for{color:var(--soft);font-weight:700;letter-spacing:.1em}
.q{font-size:clamp(27px,7.6vw,34px);font-weight:850;line-height:1.08;margin:10px 0 8px}
.hint{color:var(--soft);font-size:15px;margin:0 0 16px}
textarea,input[type=text]{width:100%;font:inherit;font-size:18px;font-weight:600;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;outline:none;transition:border-color .2s, box-shadow .2s;resize:none}
textarea{min-height:92px}
textarea:focus,input[type=text]:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(23,20,15,.07)}
::placeholder{color:#B3AA9B;font-weight:500}
.saved{font-size:12px;color:var(--green);font-weight:700;height:18px;margin-top:6px;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.verse{margin-top:16px;padding:14px 16px;background:var(--paper);border-radius:14px}
.verse b{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.verse b span{color:#A39A8B;font-weight:700}
.verse p{margin:4px 0 0;color:var(--soft);font-size:14.5px}
.nav{display:flex;gap:10px;margin-top:14px}
.btn{appearance:none;border:0;font:inherit;font-weight:700;font-size:16px;border-radius:14px;padding:15px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;transition:transform .12s, opacity .2s}
.btn:active{transform:scale(.97)}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.wa{background:#1FAF5A;color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.full{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn svg{width:20px;height:20px}
.wait{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--soft);font-size:14px;font-weight:600;padding:16px 4px 0;text-align:center}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none;animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(210,64,47,.45)}70%{box-shadow:0 0 0 10px rgba(210,64,47,0)}100%{box-shadow:0 0 0 0 rgba(210,64,47,0)}}
.hello h1{font-size:clamp(40px,12vw,54px);font-weight:900;line-height:.95;margin:8px 0 10px}
.hello .lead{font-size:16.5px;color:var(--soft);margin:0 0 20px}
.label{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:8px}
.steps-list{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:9px}
.steps-list li{display:flex;gap:12px;align-items:center;font-weight:600;font-size:15px}
.steps-list i{font-style:normal;font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:12px;width:28px;height:28px;border-radius:8px;background:var(--paper);display:grid;place-items:center;color:var(--soft);flex:none}
.steps-list li.x i{background:var(--red-soft);color:var(--red)}
/* poll */
.opts{display:grid;gap:9px}
.opt{position:relative;overflow:hidden;width:100%;text-align:left;font:inherit;font-weight:700;font-size:16.5px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:border-color .2s}
.opt .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--sand);transition:width .8s cubic-bezier(.2,.8,.2,1);z-index:0}
.opt.mine{border-color:var(--ink)}
.opt.mine .bar{background:var(--red-soft)}
.opt span{position:relative;z-index:1}
.opt .pct{font-family:Archivo,system-ui,sans-serif;font-weight:800;color:var(--soft);font-size:15px}
.opt.mine .pct{color:var(--red)}
.voted-note{font-size:13px;color:var(--soft);font-weight:600;margin-top:12px;text-align:center}
/* pair */
.say-goal{font-family:Archivo,system-ui,sans-serif;font-stretch:88%;font-weight:850;font-size:clamp(24px,7vw,30px);line-height:1.12;background:var(--paper);border-radius:16px;padding:18px;margin:4px 0 6px}
.say-goal.empty{font-family:Manrope,system-ui,sans-serif;font-weight:600;font-size:16px;color:var(--soft)}
.timer{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px}
.ring{width:78px;height:78px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:Archivo,system-ui,sans-serif;font-weight:850;font-size:24px}
.timer p{margin:0;font-weight:700;color:var(--soft);font-size:14px;max-width:180px}
/* reveal */
.reveal h1{font-size:clamp(32px,9.5vw,44px);font-weight:900;line-height:1.02;margin:6px 0 16px}
.row{padding:14px 0;border-top:1px solid var(--line)}
.row small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
.row .v{font-size:19px;font-weight:700;line-height:1.3}
.row .v.big{font-family:Archivo,system-ui,sans-serif;font-stretch:88%;font-weight:850;font-size:clamp(24px,7vw,30px);line-height:1.1}
.struck{background-image:linear-gradient(var(--red),var(--red));background-repeat:no-repeat;background-position:0 58%;background-size:0% 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;color:var(--soft);transition:background-size 1.1s cubic-bezier(.6,0,.2,1) .6s, color .6s 1s}
.struck.go{background-size:100% 3px;color:#9C9385}
.instead{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:7px;margin-bottom:8px;opacity:0;transform:translateY(6px);transition:all .5s 1.8s}
.instead.go{opacity:1;transform:none}
.week-row .v{opacity:0;transform:translateY(8px);transition:all .6s 2s}
.week-row.go .v{opacity:1;transform:none}
.actions{display:grid;gap:10px;margin-top:16px}
.small-link{background:none;border:0;color:var(--soft);font:inherit;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:12px;cursor:pointer}
.empty-note{color:var(--soft)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(23,20,15,.9);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:20;gap:14px}
.modal.on{display:flex}
.modal img{max-height:64dvh;max-width:100%;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal p{color:#EDE6D8;margin:0;font-size:14px;text-align:center;max-width:320px}
.modal .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn.out{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.3)}
.foot{text-align:center;font-size:12px;color:#A39A8B;margin-top:18px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand" id="brand">Relentless Love Church</div>
    <div class="dots" id="dots"></div>
  </div>
  <main id="main"></main>
  <div class="foot" id="foot">Your answers stay on this phone.</div>
</div>

<div class="modal" id="modal">
  <img id="wallImg" alt="Your goal card as a lock screen">
  <p id="modalTip"></p>
  <div class="btns">
    <a class="btn red" id="dlBtn" download="my-goal-card.png">Download</a>
    <button class="btn out" id="shareBtn">Share</button>
    <button class="btn out" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
const SB_URL = 'https://vbafqulhbskaswkyjjdn.supabase.co';
const SB_KEY = 'sb_publishable_XK50Ttn1qZW7HvNz1EMFhQ_gzsvAFko';
const SLUG = (new URLSearchParams(location.search).get('e') || 'rlc').toLowerCase();
const LS = 'goalcard:' + SLUG;

const DEFAULT = {
  title:'Your Goal Card', host:'Relentless Love Church', logo_url:'',
  intro:'Keep this page open. Each card opens as the message goes on. Your answers stay on your phone.',
  wall_ref:'Proverbs 16:3', wall_verse:'Commit your works to the LORD and your plans will be achieved.',
  steps:[
    {key:'worry',type:'question',q:'What are you worried about for next year?',hint:'Be honest, {name}. Only you will see this.',ex:"e.g. That I'll still be in the same place this time next year",ref:'Matthew 6:27',verse:'Who of you by worrying can add a single hour to his life?'},
    {key:'worry_poll',type:'poll',q:'{name}, what is that worry mostly about?',hint:'Tap one. Then look at the screen.',options:['Money','School or exams','Work or career','Family','Direction and purpose','Relationships']},
    {key:'goal',type:'question',q:'{name}, what is the one thing you want to get done?',hint:"One sentence. Plain enough that you'd know when it's done.",ex:'e.g. Sell 20 pairs of shoes by the end of March',ref:'Habakkuk 2:2',verse:'Write down this vision and clearly inscribe it on tablets, so that a herald may run with it.'},
    {key:'say',type:'pair',q:'Say it out loud',hint:'Turn to the person next to you. Read your goal to them, word for word. Then listen to theirs.',seconds:60,ref:'Proverbs 27:17',verse:'As iron sharpens iron, so one man sharpens another.'},
    {key:'cost',type:'question',q:'What will it cost you, {name}?',hint:"Sleep, phone time, weekends, money, some friends. Name it now so it doesn't surprise you later.",ex:'e.g. One hour of phone time every night',ref:'Luke 14:28',verse:'Which of you, wishing to build a tower, does not first sit down and count the cost to see if he has the resources to complete it?'},
    {key:'week',type:'question',q:'{name}, what will you do this week?',hint:'Small enough to start before next Sunday.',ex:'e.g. Post 5 shoes on my WhatsApp status by Wednesday',ref:'Matthew 6:34',verse:'Therefore do not worry about tomorrow, for tomorrow will worry about itself. Today has enough trouble of its own.'},
    {key:'person',type:'question',q:'Who will check on you?',hint:'One name. Someone who will actually ask.',ex:'e.g. Tolu',ref:'Ecclesiastes 4:10',verse:'For if one falls, his companion can lift him up; but pity the one who falls without another to help him up!'}
  ]
};

let cfg = DEFAULT, live = {current_step:0, free_mode:false, updated_at:null};
let answers = {}, view = 0, lastUnlocked = -1, fails = 0, offline = false;
let counts = {}, pollKey = null, timerEnd = null, timerTick = null;
try{ answers = JSON.parse(localStorage.getItem(LS)) || {} }catch(e){}
if(!answers._device){ answers._device = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); }
if(!answers._votes) answers._votes = {};
function persist(){ try{ localStorage.setItem(LS, JSON.stringify(answers)) }catch(e){} }
persist();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N = () => cfg.steps.length;
const REVEAL = () => N() + 1;
const unlocked = () => (live.free_mode || offline) ? REVEAL() : Math.max(0, Math.min(REVEAL(), live.current_step|0));
const get = k => (answers[k]||'').trim();
const firstName = () => { const n = get('name').split(/\s+/)[0] || ''; return n ? n.charAt(0).toUpperCase() + n.slice(1) : ''; };
function personal(t){
  t = String(t||''); const n = firstName();
  if(n) return t.replace(/\{name\}/g, n);
  t = t.replace(/\{name\},\s*/g,'').replace(/,\s*\{name\}/g,'').replace(/\s*\{name\}/g,'');
  return t.charAt(0).toUpperCase() + t.slice(1);
}

async function rest(path){
  const r = await fetch(SB_URL + '/rest/v1/' + path, {headers:{apikey:SB_KEY}, cache:'no-store'});
  if(!r.ok) throw new Error(r.status); return r.json();
}
async function rpc(fn, body){
  const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {method:'POST', headers:{apikey:SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if(!r.ok) throw new Error(r.status); const t = await r.text(); return t ? JSON.parse(t) : null;
}

function setBrand(){
  const b = $('#brand');
  if(cfg.logo_url){ b.innerHTML = `<img src="${esc(cfg.logo_url)}" alt=""><span>${esc(cfg.host||'')}</span>`; }
  else b.textContent = cfg.host || '';
}

async function loadAll(keepView){
  try{
    const rows = await rest(`goalcard_events?slug=eq.${encodeURIComponent(SLUG)}&select=title,host,intro,logo_url,wall_ref,wall_verse,steps,current_step,free_mode,updated_at`);
    if(rows[0]){
      const r = rows[0];
      cfg = {title:r.title, host:r.host, intro:r.intro, logo_url:r.logo_url, wall_ref:r.wall_ref, wall_verse:r.wall_verse,
             steps:Array.isArray(r.steps) && r.steps.length ? r.steps : DEFAULT.steps};
      live = {current_step:r.current_step, free_mode:r.free_mode, updated_at:r.updated_at};
    }
    fails = 0; offline = false;
  }catch(e){ fails++; if(fails >= 2) offline = true; }
  setBrand();
  document.title = cfg.title || 'Your Goal Card';
  if(!keepView){ view = unlocked(); }
  else if(view > unlocked()) view = unlocked();
  lastUnlocked = unlocked();
  render();
}

async function poll(){
  if(document.hidden) return;
  try{
    const s = await rpc('goalcard_state', {p_slug:SLUG});
    fails = 0; if(offline) offline = false;
    if(!s) return;
    const stepChanged = s.current_step !== live.current_step || s.free_mode !== live.free_mode;
    const cfgChanged = s.updated_at !== live.updated_at && !stepChanged;
    live = {current_step:s.current_step, free_mode:s.free_mode, updated_at:s.updated_at};
    counts = s.counts || {}; pollKey = s.poll_key;
    if(s.timer_ms != null){ const end = Date.now() + s.timer_ms; if(!timerEnd || Math.abs(end - timerEnd) > 1500) timerEnd = end; }
    else timerEnd = null;
    if(cfgChanged) return loadAll(true);
    if(stepChanged) onUnlock(); else { updatePollBars(); updateTimer(); }
  }catch(e){
    fails++;
    if(fails >= 6 && !offline){ offline = true; onUnlock(); }
  }
}

function onUnlock(){
  const u = unlocked();
  if(u > lastUnlocked){
    const wasCaughtUp = view >= lastUnlocked;
    lastUnlocked = u;
    if(!(live.free_mode || offline) || wasCaughtUp){ view = u; }
    try{ navigator.vibrate && navigator.vibrate(40) }catch(e){}
    render();
  } else if(u < lastUnlocked){
    lastUnlocked = u; if(view > u) view = u; render();
  } else { renderDots(); }
}

function renderDots(){
  const u = unlocked(), n = N(); let h = '';
  for(let i=1;i<=n;i++) h += `<div class="dot ${i<=u?'open':''} ${i===view?'here':''}"></div>`;
  $('#dots').innerHTML = view >= 1 ? h : '';
}

function waitLine(){
  const u = unlocked();
  if(u >= REVEAL() || view < u) return '';
  return `<div class="wait"><span class="pulse"></span>${u===0 ? 'The first card opens when the message starts.' : 'Eyes up. The next card opens soon.'}</div>`;
}
function navHTML(){
  const u = unlocked();
  return `<div class="nav">
      <button class="btn ghost" id="back" ${view<=1?'disabled':''}>Back</button>
      <button class="btn dark" style="flex:1" id="fwd" ${view>=u?'disabled':''}>${view+1>N() ? 'See my card' : 'Next card'}</button>
    </div>${waitLine()}`;
}
function bindNav(){
  $('#back').onclick = () => { view--; render(); };
  $('#fwd').onclick = () => { view++; render(); };
}
function head(i){
  const n = firstName();
  return `<div class="num"><span>CARD ${String(i).padStart(2,'0')} <span class="for">/ ${String(N()).padStart(2,'0')}</span></span>${n?`<span class="for">FOR ${esc(n.toUpperCase())}</span>`:''}</div>`;
}
function verseHTML(s){
  if(!s.ref || !s.verse) return '';
  return `<div class="verse"><b>${esc(s.ref)}<span>BSB</span></b><p>${esc(s.verse)}</p></div>`;
}
function art(s){ return `<div class="art">${window.GC_ART ? GC_ART(s.key, s.type) : ''}</div>`; }

function render(){
  renderDots();
  clearInterval(timerTick); timerTick = null;
  const m = $('#main');
  $('#foot').classList.toggle('hide', view >= REVEAL());
  window.scrollTo({top:0});
  if(view === 0) return renderHello(m);
  if(view >= REVEAL()) return renderReveal(m);
  const s = cfg.steps[view-1];
  if(s.type === 'poll') return renderPoll(m, s);
  if(s.type === 'pair') return renderPair(m, s);
  m.innerHTML = `
    <div class="card">${art(s)}
      <div class="body">
        ${head(view)}
        <h2 class="q">${esc(personal(s.q))}</h2>
        <p class="hint">${esc(personal(s.hint))}</p>
        ${s.key==='person'
          ? `<input type="text" id="ans" maxlength="40" autocomplete="off" placeholder="${esc(s.ex)}">`
          : `<textarea id="ans" maxlength="220" rows="3" placeholder="${esc(s.ex)}"></textarea>`}
        <div class="saved" id="saved">Saved on your phone</div>
        ${verseHTML(s)}
      </div>
    </div>${navHTML()}`;
  const a = $('#ans'); a.value = answers[s.key] || ''; let t;
  a.addEventListener('input', () => {
    answers[s.key] = a.value.trim(); persist();
    clearTimeout(t); $('#saved').classList.add('on'); t = setTimeout(()=>$('#saved').classList.remove('on'), 1200);
  });
  bindNav();
}

/* ---------- poll ---------- */
function renderPoll(m, s){
  const mine = answers._votes[s.key];
  m.innerHTML = `
    <div class="card">${art(s)}
      <div class="body">
        ${head(view)}
        <h2 class="q">${esc(personal(s.q))}</h2>
        <p class="hint">${esc(personal(s.hint))}</p>
        <div class="opts" id="opts">
          ${(s.options||[]).map((o,i)=>`<button class="opt ${mine===i?'mine':''}" data-i="${i}"><i class="bar"></i><span>${esc(o)}</span><span class="pct"></span></button>`).join('')}
        </div>
        <div class="voted-note" id="vnote">${mine!=null ? 'Your answer is in. You can change it.' : 'Nobody sees who picked what.'}</div>
      </div>
    </div>${navHTML()}`;
  m.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
    const i = +b.dataset.i; const prev = answers._votes[s.key];
    answers._votes[s.key] = i; persist();
    m.querySelectorAll('.opt').forEach(x => x.classList.toggle('mine', +x.dataset.i===i));
    $('#vnote').textContent = 'Your answer is in. You can change it.';
    if(prev !== i){ counts = {...counts}; if(prev!=null) counts[prev] = Math.max(0,(counts[prev]||1)-1); counts[i] = (counts[i]||0)+1; }
    updatePollBars(true);
    try{ navigator.vibrate && navigator.vibrate(20) }catch(e){}
    try{ await rpc('goalcard_vote', {p_slug:SLUG, p_key:s.key, p_device:answers._device, p_choice:i}); }catch(e){}
    if(pollKey !== s.key) fetchPoll(s.key);
  });
  bindNav();
  if(mine != null && pollKey !== s.key) fetchPoll(s.key); else updatePollBars();
}
async function fetchPoll(key){
  try{ const c = await rpc('goalcard_poll', {p_slug:SLUG, p_key:key}); if(c){ counts = c; updatePollBars(true); } }catch(e){}
}
function updatePollBars(force){
  const s = cfg.steps[view-1]; if(!s || s.type!=='poll') return;
  if(!force && pollKey !== s.key) return;
  if(answers._votes[s.key] == null) return;
  const total = Object.values(counts).reduce((a,b)=>a+(+b||0),0) || 1;
  document.querySelectorAll('.opt').forEach(b => {
    const n = +(counts[b.dataset.i]||0), pct = Math.round(n*100/total);
    b.querySelector('.bar').style.width = pct + '%';
    b.querySelector('.pct').textContent = pct + '%';
  });
}

/* ---------- pair ---------- */
function renderPair(m, s){
  const goal = get('goal');
  m.innerHTML = `
    <div class="card">${art(s)}
      <div class="body">
        ${head(view)}
        <h2 class="q">${esc(personal(s.q))}</h2>
        <p class="hint">${esc(personal(s.hint))}</p>
        <div class="label">Read this to them</div>
        <div class="say-goal ${goal?'':'empty'}">${goal ? esc(goal) : 'Go back to your goal card and write it first.'}</div>
        <div class="timer hide" id="timer">
          <div class="ring"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" stroke="#EDE4D3" stroke-width="7" fill="none"/><circle id="arc" cx="40" cy="40" r="34" stroke="#D2402F" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="0"/></svg><b id="secs">60</b></div>
          <p id="tmsg">You first. Then swap.</p>
        </div>
        ${verseHTML(s)}
      </div>
    </div>${navHTML()}`;
  bindNav();
  updateTimer();
}
function updateTimer(){
  const s = cfg.steps[view-1]; const box = $('#timer');
  if(!s || s.type!=='pair' || !box) return;
  if(!timerEnd || unlocked() !== view){ box.classList.add('hide'); return; }
  box.classList.remove('hide');
  const total = (s.seconds||60) * 1000;
  const tick = () => {
    const left = Math.max(0, timerEnd - Date.now());
    $('#secs').textContent = Math.ceil(left/1000);
    $('#arc').setAttribute('stroke-dashoffset', String(213.6 * (1 - left/total)));
    $('#tmsg').textContent = left <= 0 ? 'Time. Eyes back up.' : left < total/2 ? 'Swap. Now listen to theirs.' : 'You first. Then swap.';
    if(left <= 0){ clearInterval(timerTick); timerTick = null; try{ navigator.vibrate && navigator.vibrate([60,60,60]) }catch(e){} }
  };
  tick(); if(!timerTick) timerTick = setInterval(tick, 250);
}

        Save as my lock screen</button>
      <a class="btn wa full ${missing?'hide':''}" id="waBtn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.4A9 9 0 1 1 21 12z"/></svg>
        Send it to ${person ? esc(person) : 'someone'} on WhatsApp</a>

  }, 60);

/* ---------- lock screen image ---------- */
function wrap(ctx, text, maxW){
  const words = String(text).split(/\s+/), lines = []; let line = '';
  for(const w of words){
    const t = line ? line + ' ' + w : w;
    if(ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t;
  }
  if(line) lines.push(line); return lines;
}
function fit(ctx, text, maxW, maxLines, start, min, weight, family){
  let size = start;
  while(size > min){ ctx.font = `${weight} ${size}px ${family}`; if(wrap(ctx, text, maxW).length <= maxLines) break; size -= 4; }
  ctx.font = `${weight} ${size}px ${family}`;
  return {size, lines: wrap(ctx, text, maxW)};
}
function loadImg(src){ return new Promise(res => { if(!src) return res(null); const i = new Image(); i.crossOrigin='anonymous'; i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; }); }

async function makeWallpaper(){
  const btn = $('#wallBtn'); const old = btn.innerHTML; btn.textContent = 'Making it...';
  try{ await Promise.all([document.fonts.load('900 80px Archivo'), document.fonts.load('800 40px Manrope'), document.fonts.load('700 40px Manrope'), document.fonts.load('500 40px Manrope')]); }catch(e){}
  const logo = await loadImg(cfg.logo_url);
  const W = 1080, H = 2340, X = 96, MW = W - X*2;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#111B3D'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = 'rgba(255,255,255,.035)';
  for(let y=0;y<H;y+=36) for(let x=0;x<W;x+=36){ ctx.beginPath(); ctx.arc(x,y,2,0,7); ctx.fill(); }

  const name = firstName(), worry = get('worry'), goal = get('goal'), week = get('week'), person = get('person');
  const HEAD = 'Archivo, Arial, sans-serif', BODY = 'Manrope, Arial, sans-serif';

  // verse block sits at the bottom; measure it first
  ctx.font = `500 34px ${BODY}`;
  const vl = wrap(ctx, cfg.wall_verse || '', MW);
  const verseTop = H - 330 - vl.length * 46 - 34;

  // main block: dry run measures height, real run draws
  function block(y0, draw, opts){
    let y = y0;
    const T = (txt, x, yy) => { if(draw) ctx.fillText(txt, x, yy); };
    ctx.fillStyle = '#E2513F'; ctx.font = `800 34px ${BODY}`;
    T((name ? name.toUpperCase() + ', ' : '') + 'THIS IS THE YEAR I', X, y); y += 30;
    const g = fit(ctx, goal, MW, 4, opts.goalMax, 56, 900, HEAD);
    ctx.fillStyle = '#FFFDF8';
    for(const l of g.lines){ y += g.size * 1.02; T(l, X, y); }
    y += 80;
    if(draw){ ctx.fillStyle = 'rgba(255,253,248,.18)'; ctx.fillRect(X, y, MW, 2); } y += 70;
    ctx.fillStyle = '#E2513F'; ctx.font = `800 30px ${BODY}`; T('THIS WEEK', X, y); y += 16;
    const w = fit(ctx, week, MW, 3, 56, 36, 700, BODY);
    ctx.fillStyle = '#FFFDF8';
    for(const l of w.lines){ y += w.size * 1.25; T(l, X, y); }
    if(worry && opts.worry){
      y += 64;
      ctx.fillStyle = 'rgba(255,253,248,.45)'; ctx.font = `800 30px ${BODY}`; T('NO LONGER WORRIED ABOUT', X, y); y += 12;
      const wr = fit(ctx, worry, MW, 2, 38, 28, 500, BODY);
      for(const l of wr.lines){
        y += wr.size * 1.35;
        ctx.fillStyle = 'rgba(255,253,248,.5)'; T(l, X, y);
        if(draw){ const lw = ctx.measureText(l).width; ctx.fillStyle = '#E2513F'; ctx.fillRect(X - 4, y - wr.size*0.33, lw + 8, 5); }
      }
    }
    if(person && opts.person){
      y += 64;
      ctx.fillStyle = 'rgba(255,253,248,.45)'; ctx.font = `800 30px ${BODY}`; T('CHECKING ON ME', X, y); y += 50;
      ctx.fillStyle = '#FFFDF8'; ctx.font = `700 42px ${BODY}`; T(person, X, y);
    }
    return y;
  }
  // pick the richest layout that fits between the clock area and the verse
  const tries = [
    {goalMax:104, worry:true, person:true}, {goalMax:88, worry:true, person:true},
    {goalMax:88, worry:true, person:false}, {goalMax:80, worry:false, person:false}
  ];
  const minTop = 740, idealTop = 960, room = verseTop - 90;
  let chosen = tries[tries.length-1], top = minTop;
  for(const t of tries){
    const h = block(0, false, t);
    if(minTop + h <= room){ chosen = t; top = Math.min(idealTop, room - h); break; }
  }
  block(top, true, chosen);

  let by = H - 330 - vl.length * 46;
  ctx.font = `500 34px ${BODY}`; ctx.fillStyle = 'rgba(255,253,248,.72)';
  for(const l of vl){ ctx.fillText(l, X, by); by += 46; }
  ctx.fillStyle = '#E2513F'; ctx.font = `800 28px ${BODY}`; ctx.fillText((cfg.wall_ref||'').toUpperCase(), X, by + 16);
  if(logo){
    const lh = 92, lw = logo.width * (lh / logo.height);
    ctx.drawImage(logo, X, H - 214, lw, lh);
    ctx.fillStyle = 'rgba(255,253,248,.55)'; ctx.font = `800 24px ${BODY}`;
    ctx.fillText((cfg.host||'').toUpperCase(), X + lw + 24, H - 160);
  } else {
    ctx.fillStyle = 'rgba(255,253,248,.3)'; ctx.font = `700 24px ${BODY}`; ctx.fillText((cfg.host||'').toUpperCase(), X, H - 150);
  }
  c.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    $('#wallImg').src = url; $('#dlBtn').href = url;
    const file = new File([blob], 'my-goal-card.png', {type:'image/png'});
    const canShare = navigator.canShare && navigator.canShare({files:[file]});
    $('#shareBtn').classList.toggle('hide', !canShare);
    $('#shareBtn').onclick = async () => { try{ await navigator.share({files:[file], title:'My goal card'}) }catch(e){} };
    $('#modalTip').textContent = /iPhone|iPad/i.test(navigator.userAgent)
      ? 'Press and hold the picture, then tap Save to Photos. Set it as your lock screen from Photos.'
      : 'Tap Download, then set it as your lock screen from your gallery.';
    $('#modal').classList.add('on');
    btn.innerHTML = old;
  }, 'image/png');
}
function closeModal(){ $('#modal').classList.remove('on'); }

loadAll().then(poll);
